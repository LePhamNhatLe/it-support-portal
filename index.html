<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Support Portal</title><style>:root{--b:#155eef;--i:#172033;--m:#667085;--l:#dce3ef}*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:var(--i);background:#f4f7fb}.hero{padding:32px max(20px,calc((100vw - 1100px)/2));color:#fff;background:linear-gradient(125deg,#0b1739,var(--b))}.hero h1{margin:4px 0}.wrap{width:min(1100px,calc(100% - 28px));margin:22px auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.ticket{padding:16px;border:1px solid var(--l);border-radius:13px;background:#fff}.stat span,.meta{color:var(--m);font-size:12px}.stat strong{display:block;font-size:26px}.grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:16px;margin-top:16px}.panel h2{margin-top:0}form,label{display:grid;gap:7px}form{gap:13px}.row,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd7e5;border-radius:8px;font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;font-weight:700}.primary,.save{color:#fff;background:var(--b)}.toolbar,.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tickets{display:grid;gap:11px}.ticket{margin-top:11px}.ticket h3{margin:9px 0}.ticket label{margin-top:9px;font-size:12px;font-weight:700}.badge{margin-left:7px;padding:3px 7px;border-radius:99px;color:#1849a9;background:#eaf2ff;font-size:11px}.High,.Critical{color:#b42318;background:#fee4e2}.delete{padding:0;color:#b42318;background:none}.empty{padding:28px;text-align:center;color:var(--m);border:1px dashed #b9c6da}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:460px){.row,.actions{grid-template-columns:1fr}}</style></head><body><header class="hero"><small>HELPDESK PRACTICE PROJECT</small><h1>IT Support Portal</h1><p>Create, assign, track, and resolve support requests.</p></header><main class="wrap"><section class="stats"><article class="stat"><span>All</span><strong id="all">0</strong></article><article class="stat"><span>Open</span><strong id="open">0</strong></article><article class="stat"><span>In progress</span><strong id="progress">0</strong></article><article class="stat"><span>Resolved</span><strong id="resolved">0</strong></article></section><section class="grid"><article class="panel"><h2>Create ticket</h2><form id="form"><label>Issue title<input name="title" required placeholder="Cannot connect to office Wi-Fi"></label><div class="row"><label>Category<select name="category"><option>Network</option><option>Hardware</option><option>Software</option><option>Printer</option><option>Account</option></select></label><label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label></div><label>Requester<input name="requester" required></label><label>Description<textarea name="description" required rows="4"></textarea></label><button class="primary">Create ticket</button></form></article><article class="panel"><div class="toolbar"><h2>Support queue</h2><select id="filter"><option value="All">All statuses</option><option>New</option><option>Assigned</option><option>In Progress</option><option>Waiting for User</option><option>Resolved</option><option>Closed</option></select></div><div id="empty" class="empty">No tickets yet.</div><div id="tickets" class="tickets"></div></article></section></main><template id="tpl"><article class="ticket"><div class="top"><div><b class="id"></b><span class="badge"></span></div><button class="delete">Delete</button></div><h3></h3><p class="desc"></p><p class="meta"></p><div class="actions"><label>Status<select class="status"><option>New</option><option>Assigned</option><option>In Progress</option><option>Waiting for User</option><option>Resolved</option><option>Closed</option></select></label><label>Technician<input class="tech" placeholder="Unassigned"></label></div><label>Resolution / troubleshooting notes<textarea class="notes" rows="3"></textarea></label><button class="save">Save update</button></article></template><script>const K="it-support-tickets",F=document.querySelector("#form"),L=document.querySelector("#tickets"),E=document.querySelector("#empty"),Q=document.querySelector("#filter"),T=document.querySelector("#tpl");let a=[];try{a=JSON.parse(localStorage.getItem(K))||[]}catch{}const save=()=>localStorage.setItem(K,JSON.stringify(a));F.onsubmit=e=>{e.preventDefault();let d=new FormData(F),n=a.reduce((m,x)=>Math.max(m,+x.id.slice(4)||0),0)+1;a.unshift({id:"INC-"+String(n).padStart(4,"0"),title:d.get("title").trim(),category:d.get("category"),priority:d.get("priority"),requester:d.get("requester").trim(),description:d.get("description").trim(),status:"New",tech:"",notes:"",created:new Date().toISOString()});save();F.reset();render()};Q.onchange=render;function render(){let s=Q.value==="All"?a:a.filter(x=>x.status===Q.value);L.innerHTML="";E.classList.toggle("hidden",s.length>0);s.forEach(x=>{let f=T.content.cloneNode(true),c=f.querySelector(".ticket");c.querySelector(".id").textContent=x.id;c.querySelector(".badge").textContent=x.priority;c.querySelector(".badge").classList.add(x.priority);c.querySelector("h3").textContent=x.title;c.querySelector(".desc").textContent=x.description;c.querySelector(".meta").textContent=x.category+" · "+x.requester+" · "+new Date(x.created).toLocaleDateString();c.querySelector(".status").value=x.status;c.querySelector(".tech").value=x.tech;c.querySelector(".notes").value=x.notes;c.querySelector(".save").onclick=()=>{x.status=c.querySelector(".status").value;x.tech=c.querySelector(".tech").value;x.notes=c.querySelector(".notes").value;save();render()};c.querySelector(".delete").onclick=()=>{if(confirm("Delete "+x.id+"?")){a=a.filter(y=>y.id!==x.id);save();render()}};L.appendChild(f)});all.textContent=a.length;open.textContent=a.filter(x=>["New","Assigned","Waiting for User"].includes(x.status)).length;progress.textContent=a.filter(x=>x.status==="In Progress").length;resolved.textContent=a.filter(x=>["Resolved","Closed"].includes(x.status)).length}render()</script></body></html>
