<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Cổng IT Support</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-card__header">
          <h1 id="login-title">Cổng IT Support</h1>
          <p class="login-card__subtitle">Đăng nhập để tiếp tục</p>
        </div>

        <form class="login-form">
          <div id="login-error" class="login-form__error" role="alert" aria-live="polite"></div>

          <div class="login-form__field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="Nhập email"
              required
            />
          </div>

          <div class="login-form__field">
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>

          <button type="submit" class="login-form__submit">Đăng nhập</button>
        </form>
      </section>
    </main>

    <script src="../data/seed-data.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
